# ============================================================
# AMBIGUEDADES A RESOLVER
# ============================================================
ambiguidades:
  - motivo: "Correção / Erro / Retorno para determinado fluxo"
    categoria: "Retorno de Tarefa"
    problema: "Genéricos demais (17 tickets no DOCX só em 'Retorno para determinado fluxo'). Escondem subgrupos."
    acao: "Rodar descoberta não supervisionada (Fase 5) nesses tickets e propor subgrupos."

  - motivo: "Incorporar juros e correção (decisão judicial)"
    categoria: "Retorno de Tarefa"
    problema: "Aparece duplicado com e sem '(decisão judicial)' no DOCX."
    acao: "Propor mesclar ou separar com justificativa."

  - motivo: "Erro no cálculo de correção de saldo de inatividade – fluxo de extinção / Saldo de extinção divergente"
    categoria: "Cadastro"
    problema: "Parecem pertencer a Extinção, não Cadastro. Possível categoria declarada ≠ real."
    acao: "Verificar se a categoria declarada está correta; considerar mover para Extinção."
