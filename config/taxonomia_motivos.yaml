# config/taxonomia_motivos.yaml
# ============================================================
# Taxonomia-semente de motivos reais de tickets (Help360 / SPPREV)
# Fase 2 (revisada) — regras hierárquicas com precedência.
#
# Estrutura:
#   categorias:
#     <categoria_declarada>:
#       motivos:
#         <motivo_id>:
#           nome: <nome legível>
#           descricao: <descrição curta>
#           palavras_chave: [regex case-insensitive]
#           exemplos: [exemplos de título/texto]
#           requer_autorizacao: false
#           ativo: true
#           precedencia: <int>   # menor = mais prioritario (vence em empate)
# ============================================================

versao: "2.0"
criado_em: "2026-11-05"
fonte: "Análise TOP 3.docx (09/2026) + inspeção do banco tickets.db"

